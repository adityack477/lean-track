<style>
:root{color-scheme:dark;--bg:#0b0f0d;--c:#151b18;--t:#e9efeb;--m:#8f9b94;--a:#2fbf84;--b:#242d28;--r:#ff6b5e}
*{box-sizing:border-box}body{margin:0;font:15px system-ui,sans-serif;background:var(--bg);color:var(--t);padding-bottom:70px}
main{max-width:560px;margin:auto;padding:12px}
button{font-weight:600;box-shadow:0 2px 8px #0005}.card{box-shadow:0 2px 12px #0006;background:var(--c);border:1px solid var(--b);border-radius:16px;padding:14px;margin-bottom:10px}
h2{margin:4px 0 10px;font-size:18px}h3{margin:0 0 6px;font-size:15px}
input,select{width:100%;padding:9px;border:1px solid var(--b);border-radius:8px;background:var(--bg);color:var(--t);font-size:15px}
label{display:block;font-size:12px;color:var(--m);margin:8px 0 3px}
button{background:var(--a);color:#fff;border:0;border-radius:8px;padding:10px 14px;font-size:15px;margin-top:8px}
button.s{background:var(--b);color:var(--t)}.row{display:flex;gap:8px}.row>*{flex:1}
nav{backdrop-filter:blur(12px);padding-bottom:env(safe-area-inset-bottom);position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--c);border-top:1px solid var(--b)}
nav button{flex:1;background:none;color:var(--m);border-radius:0;margin:0;padding:12px 2px;font-size:12px}
nav button.on{color:var(--a);font-weight:700}
.bar{height:8px;background:var(--b);border-radius:4px;overflow:hidden;margin:3px 0 8px}.bar i{display:block;height:100%;background:var(--a)}
.m{color:var(--m);font-size:13px}.big{background:linear-gradient(90deg,#2fbf84,#7be0b6);-webkit-background-clip:text;color:transparent;font-size:32px;font-weight:700}.w{color:var(--r)}
.it{display:grid;grid-template-columns:1fr 80px 26px;gap:6px;align-items:center;margin:6px 0}

const $=s=>document.querySelector(s),dk=o=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4-o*864e5).toISOString().slice(0,10),today=()=>dk(0);
let S=JSON.parse(localStorage.getItem("lean")||"null")||{prof:{},w:[],meals:[],key:"",model:"gemini-flash-latest",usda:""};
const save=()=>localStorage.setItem("lean",JSON.stringify(S));
let pick=null,lastFile=null,tab="dash",draft=null,busy="";

// ---- Calculations ----
const AF={1.2:"Sedentary (classes, little exercise)",1.375:"Light (1-3 workouts/week)",1.55:"Moderate (3-5 workouts/week)",1.725:"Heavy (6-7 workouts/week)"};
const lastW=()=>S.w.length?S.w[S.w.length-1].w:+S.prof.wt||0;
function slope(pts){const n=pts.length,mx=pts.reduce((a,p)=>a+p[0],0)/n,my=pts.reduce((a,p)=>a+p[1],0)/n;let nu=0,de=0;pts.forEach(p=>{nu+=(p[0]-mx)*(p[1]-my);de+=(p[0]-mx)**2});return de?nu/de:0}
function wRate(days=21){const pts=S.w.map(x=>[(new Date(x.d)-new Date(dk(days)))/864e5,x.w]).filter(p=>p[0]>=0);return pts.length>=3&&pts.at(-1)[0]-pts[0][0]>=7?slope(pts):null}
function adaptive(){const sl=wRate(21);if(sl==null)return null;const ks=[];for(let i=0;i<21;i++){const t=dayTot(dk(i));if(t.k>300)ks.push(t.k)}
 if(ks.length<10)return null;return ks.reduce((a,b)=>a+b)/ks.length-sl*7700}
function plan(){const p=S.prof,w=lastW();if(!(w&&p.ht&&p.age&&p.goal&&p.days))return null;
 const bmr=10*w+6.25*p.ht-5*p.age+(p.sex=="f"?-161:5),f0=bmr*(p.act||1.375),ad=adaptive(),tdee=ad&&ad>f0*0.7&&ad<f0*1.4?ad:f0;
 const lose=Math.max(0,w-p.goal),want=lose*7700/p.days;
 const cap=Math.min(w*0.01*7700/7,tdee*0.25),def=Math.min(want,cap);
 const floor=p.sex=="f"?1200:1500,kcal=Math.max(tdee-def,floor,0),real=tdee-kcal;
 const days=real>0?Math.ceil(lose*7700/real):0;
 const pr=1.8*w,fat=kcal*0.25/9,carb=Math.max(0,(kcal-pr*4-fat*9)/4);
 return{bmr,f0,ad:tdee!==f0,tdee,kcal,real,days,capped:want>cap+1,pr,fat,carb,fib:14*kcal/1000,wk:real*7/7700}}
const dayTot=d=>S.meals.filter(m=>m.d==d).reduce((a,m)=>{for(const k in m.t)a[k]=(a[k]||0)+m.t[k];return a},{k:0,p:0,c:0,f:0,fi:0});
const tot=its=>its.reduce((a,i)=>{const x=i.g/100;a.k+=i.k*x;a.p+=i.p*x;a.c+=i.c*x;a.f+=i.f*x;a.fi+=i.fi*x;return a},{k:0,p:0,c:0,f:0,fi:0});

// ---- Gemini ----
function shrink(file){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>{const s=Math.min(1,1024/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",0.8).split(",")[1])};im.onerror=rej;im.src=URL.createObjectURL(file)})}
async function gem(b64,prompt){if(!S.key)throw Error("Add your Gemini API key in Profile first.");
 const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${S.model}:generateContent?key=${S.key}`,{method:"POST",headers:{"Content-Type":"application/json"},
 body:JSON.stringify({contents:[{parts:[{inlineData:{mimeType:"image/jpeg",data:b64}},{text:prompt}]}],generationConfig:{responseMimeType:"application/json",temperature:0.2}})});
 const j=await r.json();if(!r.ok)throw Error(j.error?.message||"API error "+r.status);
 return JSON.parse(j.candidates[0].content.parts.map(p=>p.text||"").join("").replace(/```json|```/g,""))}
async function usda(name,k0){try{const r=await fetch(`https://api.nal.usda.gov/fdc/v1/foods/search?query=${encodeURIComponent(name)}&pageSize=3&dataType=Foundation,SR%20Legacy&api_key=${S.usda||"DEMO_KEY"}`);const j=await r.json();
 for(const f of j.foods||[]){const g=c=>(f.foodNutrients.find(x=>x.nutrientNumber==c)||{}).value||0,k=g("208")||g("957")||g("958");
 if(k>0&&(!k0||Math.abs(k-k0)/k0<0.4))return{k,p:g("203"),c:g("205"),f:g("204"),fi:g("291")}}}catch(e){}return null}
async function analyzeFood(file){lastFile=file;busy="Analyzing meal...";render();
 try{const b=await shrink(file),hint=$("#hint")?.value||"";
 const out=await gem(b,`You are a nutrition assistant for an Indian household: mostly home-cooked roti, rice, dal, sabzi, curd, with typical home oil/ghee use (count visible oil). Identify each separate food on the plate and estimate its cooked weight in grams (use plate/bowl/hand size as scale; be realistic, people usually underestimate oil and portions). Where a food matches one of these database names, set "db" to that exact name; otherwise set "db" to null and give per-100g estimates. Database: ${DB.map(d=>d.n).join("; ")}. User hint: ${hint||"none"}. Return JSON only: {"items":[{"name":string,"db":string|null,"grams":number,"kcal100":number,"p100":number,"c100":number,"f100":number,"fi100":number,"conf":"low|med|high"}]}`);
 draft=out.items.map(i=>{const d=DB.find(x=>x.n==i.db);return d?{n:d.n,g:Math.round(i.grams),k:d.k,p:d.p,c:d.c,f:d.f,fi:d.fi,src:"db",conf:i.conf}:{n:i.name,g:Math.round(i.grams),k:i.kcal100,p:i.p100,c:i.c100,f:i.f100,fi:i.fi100||0,src:"ai",conf:i.conf}})}
 catch(e){alert(e.message)}
 await Promise.all((draft||[]).map(async i=>{if(i.src=="ai"){const u=await usda(i.n,i.k);if(u)Object.assign(i,u,{src:"usda"})}}));busy="";render()}
async function analyzeBody(file){busy="Estimating...";render();
 try{const b=await shrink(file);const o=await gem(b,`Estimate body fat percentage from this physique photo as a plausible range. Be conservative and note uncertainty from lighting/pose/clothing. If no person is visible set low and high to null. JSON only: {"low":number,"high":number,"note":string}`);
 S.bfp=o;S.bfp.d=today();save()}catch(e){alert(e.message)}busy="";render()}

// ---- UI ----
const n=(x,d=0)=>(+x).toFixed(d);
const bar=(l,v,t,u="g")=>`<div class="m">${l}: ${n(v)} / ${t?n(t):"-"} ${u}</div><div class="bar"><i style="width:${t?Math.min(100,v/t*100):0}%"></i></div>`;
function vDash(){const q=plan();if(!q)return vToday();const ds=Array.from({length:7},(_,i)=>dk(6-i)),tt=ds.map(dayTot),lg=tt.filter(t=>t.k>300),av=f=>lg.length?lg.reduce((a,t)=>a+t[f],0)/lg.length:0,mx=Math.max(q.kcal*1.3,...tt.map(t=>t.k));
 const sl=wRate(21),rate=sl==null?null:sl*7,w=lastW(),I=[];
 I.push(lg.length<4?`Logged only ${lg.length}/7 days. Log most days so your maintenance estimate can personalise.`:`Logged ${lg.length}/7 days. Avg ${n(av("k"))} kcal vs target ${n(q.kcal)}.`);
 if(lg.length){const d=av("p")-q.pr;I.push(d<-15?`Protein averages ${n(av("p"))} g, ${n(-d)} g below target. Add eggs, paneer, curd, soya or whey.`:`Protein on track (${n(av("p"))} g avg).`)}
 if(rate!=null){I.push(`Weight trend: ${rate>0?"+":""}${n(rate,2)} kg/week (planned ${n(-q.wk,2)}).`);
  if(rate<-w*0.01)I.push("Losing faster than 1%/week. Eat a bit more to protect muscle.");
  else if(rate>-0.05&&q.real>200&&lg.length>=4)I.push("Weight is not dropping as planned. Photo logs usually under-count oil and portions: add a hint like 'extra oil', and recheck weekly.");
  if(rate<-0.05&&w>S.prof.goal)I.push(`At this pace you reach ${S.prof.goal} kg around ${new Date(Date.now()+(w-S.prof.goal)/(-rate/7)*864e5).toLocaleDateString()}.`)}
 else I.push("Log weight at least 3 times a week for 2 weeks to see your real trend.");
 if(q.ad)I.push(`Your learned maintenance is ${n(q.tdee)} kcal vs formula ${n(q.f0)} kcal. Targets now use the learned value.`);
 const bw=300/7;return`<div class="card"><div class="m">Today</div><div class="big">${n(tt[6].k)} <span class="m">/ ${n(q.kcal)} kcal</span></div>${bar("Protein",tt[6].p,q.pr)}
 <svg viewBox="0 0 300 90" width="100%">${tt.map((t,i)=>`<rect x="${i*bw+6}" y="${75-t.k/mx*70}" width="${bw-12}" height="${t.k/mx*70}" rx="3" fill="${t.k>q.kcal*1.1?"#c0392b":"#2fbf84"}"/><text x="${i*bw+bw/2}" y="88" font-size="9" text-anchor="middle" fill="#888">${ds[i].slice(8)}</text>`).join("")}<line x1="0" x2="300" y1="${75-q.kcal/mx*70}" y2="${75-q.kcal/mx*70}" stroke="#888" stroke-dasharray="3"/></svg><div class="m">Last 7 days (dashed line = target)</div></div>
 <div class="card"><h3>Insights</h3>${I.map(x=>`<p class="m" style="margin:6px 0">• ${x}</p>`).join("")}</div>
 <div class="card"><div class="row"><div><div class="m">Weight</div><b>${n(w,1)} kg</b></div><div><div class="m">Goal</div><b>${S.prof.goal} kg</b></div><div><div class="m">To go</div><b>${n(Math.max(0,w-S.prof.goal),1)} kg</b></div></div></div>`}
function vToday(){const p=plan(),t=dayTot(today());
 if(!p)return`<div class="card"><h2>Welcome</h2><p>Set up your <b>Profile</b> first (height, age, goal, timeline, Gemini key).</p></div>`;
 return`<div class="card"><div class="m">Calories today</div><div class="big">${n(t.k)} <span class="m">/ ${n(p.kcal)} kcal</span></div>
 ${bar("Calories",t.k,p.kcal,"kcal")}${bar("Protein",t.p,p.pr)}${bar("Carbs",t.c,p.carb)}${bar("Fat",t.f,p.fat)}${bar("Fibre",t.fi,p.fib)}</div>
 <div class="card"><h3>Meals</h3>${S.meals.filter(m=>m.d==today()).map(m=>`<div class="m">${m.time} - ${m.its.map(i=>i.n+" "+i.g+"g").join(", ")}<br><b>${n(m.t.k)} kcal</b> P${n(m.t.p)} C${n(m.t.c)} F${n(m.t.f)} <a href="#" onclick="delMeal(${m.id});return false" class="w">delete</a></div>`).join("<hr>")||'<div class="m">Nothing logged yet.</div>'}</div>`}
function vPick(){return`<div class="card"><h3>${pick<0?"Add food":"Replace with correct food"}</h3><input id="ps" placeholder="Search e.g. paneer, dosa, rice" oninput="psearch(this.value)" autofocus><div id="pr"></div><button class="s" onclick="pick=null;render()">Cancel</button></div>`}
function psearch(q){q=q.toLowerCase().trim();const m=DB.map((d,i)=>[d,i]).filter(([d])=>q&&d.n.toLowerCase().includes(q)).slice(0,8);
 $("#pr").innerHTML=m.map(([d,i])=>`<button class="s" style="display:block;width:100%;text-align:left" onclick="choose(${i})">${d.n} · ${d.k} kcal/100g</button>`).join("")+(q?`<button style="display:block;width:100%" onclick="chooseUsda()">Search USDA for "${q.replace(/"/g,"")}"</button>`:"")}
function setItem(it){if(pick<0){draft=draft||[];draft.push(it)}else it.g=draft[pick].g,draft[pick]=it;pick=null;render()}
function choose(i){const d=DB[i];setItem({n:d.n,g:100,k:d.k,p:d.p,c:d.c,f:d.f,fi:d.fi,src:"db"})}
async function chooseUsda(){const q=$("#ps").value.trim();$("#pr").innerHTML="Searching...";const u=await usda(q,0);if(!u){$("#pr").innerHTML="Not found. Try another word (English name).";return}setItem({n:q,g:100,...u,src:"usda"})}
function vAdd(){if(pick!==null)return vPick();let h=`<div class="card"><h2>Log a meal</h2><label>Optional hint (e.g. "2 rotis with dal, cooked in little oil")</label><input id="hint">
 <input id="pf" type="file" accept="image/*" capture="environment" style="display:none" onchange="analyzeFood(this.files[0])"><button onclick="$('#pf').click()">Take / choose photo</button> <span class="m">${busy}</span></div>`;
 if(draft){const t=tot(draft);h+=`<div class="card"><h3>Review and correct portions</h3><div class="m">AI estimates portions; macros come from the database. Fix grams if needed.</div>
 ${draft.map((i,x)=>`<div class="it"><div><a href="#" onclick="pick=${x};render();return false"><b>${i.n}</b> ✎</a><div class="m">${i.src=="db"?"database":i.src=="usda"?"USDA verified":"<span class='w'>AI estimate</span>"} · ${i.conf||""} · ${n(i.k*i.g/100)} kcal</div></div><input type="number" value="${i.g}" onchange="draft[${x}].g=+this.value;render()"><a href="#" class="w" onclick="draft.splice(${x},1);render();return false">✕</a></div>`).join("")}
 <div class="row"><button class="s" onclick="pick=-1;render()">+ Add food</button><button class="s" onclick="lastFile&&analyzeFood(lastFile)">Re-analyze (edit hint above)</button></div><hr><b>${n(t.k)} kcal</b> · P ${n(t.p)}g · C ${n(t.c)}g · F ${n(t.f)}g<div class="row"><button onclick="saveMeal()">Save meal</button><button class="s" onclick="draft=null;render()">Discard</button></div></div>`}return h}
function vWeight(){const w=S.w.slice(-30),mn=Math.min(...w.map(x=>x.w)),mx=Math.max(...w.map(x=>x.w)),avg=S.w.slice(-7).reduce((a,x)=>a+x.w,0)/(Math.min(7,S.w.length)||1);
 const pts=w.map((x,i)=>`${i*(300/Math.max(1,w.length-1))},${70-(x.w-mn)/(mx-mn||1)*60}`).join(" ");
 return`<div class="card"><h2>Body weight</h2><div class="row"><input id="wv" type="number" step="0.1" placeholder="kg today"><button onclick="addW()">Save</button></div>
 ${w.length>1?`<svg viewBox="0 -5 300 85" width="100%"><polyline fill="none" stroke="#2fbf84" stroke-width="2" points="${pts}"/></svg>`:""}
 <div class="m">${S.w.length?`Latest ${S.w.at(-1).w} kg · 7-day avg ${n(avg,1)} kg`:"No entries yet"}</div></div>
 <div class="card"><h3>History</h3>${S.w.slice(-14).reverse().map(x=>`<div class="m">${x.d}: ${x.w} kg</div>`).join("")}</div>`}
function vBody(){const p=S.prof,b=S.bfp;return`<div class="card"><h2>Body fat</h2><div class="m">Photo estimates are rough (about ±4-5 points). Use the trend, and the tape-measure number below as a cross-check. Photos go to Google's API.</div>
 <input id="bf" type="file" accept="image/*" style="display:none" onchange="analyzeBody(this.files[0])"><button onclick="$('#bf').click()">Photo estimate</button> <span class="m">${busy}</span>
 ${b&&b.low!=null?`<p><b>${b.low}-${b.high}%</b> <span class="m">(${b.d})<br>${b.note}</span></p>`:""}</div>
 <div class="card"><h3>Tape-measure method (US Navy)</h3><div class="row"><div><label>Waist cm</label><input id="wa" type="number"></div><div><label>Neck cm</label><input id="ne" type="number"></div><div><label>Hip cm (women)</label><input id="hi" type="number"></div></div>
 <button onclick="navy()">Calculate</button><div id="nr" class="m"></div></div>`}
function vPlan(){const p=S.prof,q=plan(),f=(k,l,t="number",e="")=>`<div><label>${l}</label><input ${e} type="${t}" value="${p[k]??""}" onchange="S.prof['${k}']=this.value${t=="number"?"*1":""};save();render()"></div>`;
 return`<div class="card"><h2>Profile and goal</h2><div class="row">${f("age","Age")}${f("ht","Height cm")}</div><div class="row">${f("wt","Start weight kg","number","step=0.1")}${f("goal","Goal weight kg","number","step=0.1")}</div>
 <div class="row"><div><label>Sex</label><select onchange="S.prof.sex=this.value;save();render()"><option value="m" ${p.sex!="f"?"selected":""}>Male</option><option value="f" ${p.sex=="f"?"selected":""}>Female</option></select></div>${f("days","Timeline (days)")}</div>
 <label>Activity</label><select onchange="S.prof.act=+this.value;save();render()">${Object.entries(AF).map(([k,v])=>`<option value="${k}" ${(p.act||1.375)==k?"selected":""}>${v}</option>`).join("")}</select></div>
 ${q?`<div class="card"><h3>Your plan</h3><div class="m">Maintenance ≈ <b>${n(q.tdee)}</b> kcal (${q.ad?"learned from your logs and weight trend":"formula estimate; becomes personalised after ~2 weeks of logging"})</div><div class="big">${n(q.kcal)} kcal/day</div>
 <div class="m">Deficit ${n(q.real)} kcal ≈ ${n(q.wk,2)} kg/week${q.capped?`<p class="w">Your timeline needs a deficit that is too aggressive, so I capped it at a safe level (max 1% bodyweight/week and 25% of maintenance). Realistic time: about ${q.days} days.</p>`:""}</div>
 <p class="m">Targets: protein ${n(q.pr)} g · carbs ${n(q.carb)} g · fat ${n(q.fat)} g · fibre ${n(q.fib)} g</p>
 <h3>Micronutrient watch-list (adult, approx.)</h3><div class="m">Calcium 1000 mg · Iron 17-21 mg (women 21-29) · Zinc 10-12 mg · Magnesium 340-440 mg · Potassium 3500 mg · Vit C 80 mg · Vit B12 2.2 mcg · Vit D 600 IU · Vit A 1000 mcg. Common gaps in veg diets: B12, vitamin D, iron, protein. General guidance, not medical advice.</div></div>`:""}
 <div class="card"><h3>Gemini API key</h3><div class="m">Free key from aistudio.google.com. Stored only on this phone.</div><label>API key</label><input type="password" value="${S.key}" onchange="S.key=this.value.trim();save()"><label>Model</label><input value="${S.model}" onchange="S.model=this.value.trim();save()">
 <label>USDA API key (optional, free at fdc.nal.usda.gov)</label><input value="${S.usda}" onchange="S.usda=this.value.trim();save()"><div class="m">If requests fail, update the model name (names change often).</div></div>
 <div class="card"><button class="s" onclick="exp()">Export data</button></div>`}
const V={dash:vDash,today:vToday,add:vAdd,weight:vWeight,body:vBody,plan:vPlan};
function render(){const y=scrollY;$("#app").innerHTML=V[tab]();$("#nav").innerHTML=[["dash","Dashboard"],["today","Meals"],["add","+ Add"],["weight","Weight"],["body","Body fat"],["plan","Profile"]].map(([k,l])=>`<button class="${tab==k?"on":""}" onclick="tab='${k}';render()">${l}</button>`).join("");scrollTo(0,y)}
function saveMeal(){const t=tot(draft);S.meals.push({id:Date.now(),d:today(),time:new Date().toTimeString().slice(0,5),its:draft,t});save();draft=null;tab="today";render()}
function delMeal(id){S.meals=S.meals.filter(m=>m.id!=id);save();render()}
function addW(){const v=+$("#wv").value;if(!v)return;S.w=S.w.filter(x=>x.d!=today());S.w.push({d:today(),w:v});S.w.sort((a,b)=>a.d<b.d?-1:1);save();render()}
function navy(){const p=S.prof,w=+$("#wa").value,ne=+$("#ne").value,hi=+$("#hi").value;if(!p.ht||!w||!ne)return $("#nr").textContent="Enter height in Profile, plus waist and neck.";$("#nr").textContent="≈ "+n(navyBF(p.sex,p.ht,w,ne,hi),1)+"% body fat"}
function exp(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:"application/json"}));a.download="leantrack.json";a.click()}
render();if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
